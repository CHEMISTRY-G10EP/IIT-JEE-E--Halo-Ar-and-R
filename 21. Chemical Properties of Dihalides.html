<script>


const Q = [
  {
    "id": "CPD1",
    "text": "What is formed when a gem-dihalide reacts with aqueous KOH?",
    "options": [
      "Vicinal diol",
      "Gem-diol that rearranges to carbonyl compound",
      "Alkene",
      "Alkane"
    ],
    "correct": "B",
    "solution": "Gem-dihalides hydrolyze to an unstable gem-diol which further rearranges to a carbonyl compound.",
    "solution_steps": [
      "RCHX₂ + 2 KOH(aq) → RCH(OH)₂ + 2 KX",
      "The gem-diol is unstable and loses water.",
      "RCH(OH)₂ → RCHO (aldehyde or ketone)"
    ]
  },
  {
    "id": "CPD2",
    "text": "What is the product when vicinal dihalides undergo hydrolysis with aqueous KOH?",
    "options": [
      "Gem-diol",
      "Vicinal diol (glycol)",
      "Alkene",
      "Alcohol"
    ],
    "correct": "B",
    "solution": "Vicinal dihalides form a vicinal diol by replacement of each halogen with –OH.",
    "solution_steps": [
      "R–CHX–CHX–R' + 2 KOH(aq) → R–CH(OH)–CH(OH)–R' + 2 KX",
      "Each halogen atom is replaced by –OH.",
      "The resulting product is a vicinal diol (glycol)."
    ]
  },
  {
    "id": "CPD3",
    "text": "What is formed when vicinal dihalides react with alcoholic KOH?",
    "options": [
      "Alkane",
      "Alkyne",
      "Vinylic halide",
      "Alcohol"
    ],
    "correct": "C",
    "solution": "Vicinal dihalides react with alcoholic KOH to form vinylic halides via elimination of H–X.",
    "solution_steps": [
      "Alcoholic KOH removes a β-hydrogen along with halogen (dehydrohalogenation).",
      "R–CHX–CHX–R' → R–C=C–X–R' (vinylic halide)",
      "Further elimination requires stronger base like NaNH₂."
    ]
  },
  {
    "id": "CPD4",
    "text": "Why do vinylic halides not undergo elimination easily with KOH?",
    "options": [
      "C–X bond is weak",
      "C–X bond is strong and KOH is not strong enough",
      "They are aromatic",
      "They are primary halides"
    ],
    "correct": "B",
    "solution": "The C–X bond in vinylic halides is strong, and alcoholic KOH is not strong enough to remove the vinylic hydrogen.",
    "solution_steps": [
      "Vinylic carbon is sp² hybridized.",
      "C–X bond has partial double bond character.",
      "Strong base like NaNH₂ is needed for further elimination."
    ]
  },
  {
    "id": "CPD5",
    "text": "What is the product when a gem-dihalide is treated with alcoholic KOH followed by NaNH₂?",
    "options": [
      "Alkane",
      "Alkene",
      "Alkyne",
      "Alcohol"
    ],
    "correct": "C",
    "solution": "Gem-dihalides form a vinylic halide with alcoholic KOH, which reacts with NaNH₂ to produce a terminal alkyne.",
    "solution_steps": [
      "Step 1: RCHX₂ + Alc.KOH → R–C=X–H (vinylic halide) + KX + H₂O",
      "Step 2: Vinylic halide + NaNH₂ → R–C≡CH + NaX + NH₃",
      "Terminal alkyne is obtained."
    ]
  },
  {
    "id": "CPD6",
    "text": "What happens when a vicinal dihalide reacts with zinc dust?",
    "options": [
      "Gem-diol formation",
      "Formation of alkene with same number of carbons",
      "Formation of alkyne",
      "Cyclization to cycloalkane"
    ],
    "correct": "B",
    "solution": "Vicinal dihalides undergo 1,2-elimination with Zn to form an alkene retaining the original carbon count.",
    "solution_steps": [
      "R–CHX–CHX–R' + 2 Zn → R–CH=CH–R' + 2 ZnX₂",
      "Zinc removes halogens as ZnX₂.",
      "1,2-elimination occurs, forming the alkene."
    ]
  },
  {
    "id": "CPD7",
    "text": "What is the result of treating gem-dihalides with zinc dust?",
    "options": [
      "Alkene with same number of carbons",
      "Coupling to higher symmetrical alkene",
      "Alcohol",
      "Cycloalkane"
    ],
    "correct": "B",
    "solution": "Gem-dihalides form carbene intermediates with zinc, which dimerize to give higher symmetrical alkenes.",
    "solution_steps": [
      "2 RCHX₂ + 2 Zn → [2 RCH: carbene intermediate] + 2 ZnX₂",
      "Two carbenes combine to form higher alkene.",
      "Number of carbons doubles in product compared to single gem-dihalide."
    ]
  },
  {
    "id": "CPD8",
    "text": "Which reaction describes formation of cycloalkanes from α–ω dihalides?",
    "options": [
      "R–CHX₂ + Zn → Alkene",
      "X–(CH₂)ₙ–X + Zn → Cyclo-(CH₂)ₙ + 2 ZnX₂",
      "R–CHX₂ + Alc.KOH → Vinylic halide",
      "R–CHX–CHX–R' + Zn → Alkene"
    ],
    "correct": "B",
    "solution": "α–ω dihalides react with Zn (or Na) to cyclize, forming cycloalkanes via intramolecular coupling.",
    "solution_steps": [
      "Both halogens at terminal carbons are removed as ZnX₂.",
      "The two ends bond to each other forming a ring.",
      "Ring size depends on number of –CH₂– units (n=3 → cyclobutane, n=4 → cyclopentane, etc.)."
    ]
  },
  {
    "id": "CPD9",
    "text": "What is the main product when gem-dihalides react with KCN followed by hydrolysis?",
    "options": [
      "Dicarboxylic acid",
      "Monocarboxylic acid",
      "Alkane",
      "Alkene"
    ],
    "correct": "B",
    "solution": "Gem-dihalides react with KCN to form dicyano compounds, which hydrolyze and decarboxylate to give monocarboxylic acids.",
    "solution_steps": [
      "Step 1: R–CHX₂ + 2 KCN → R–CH(CN)₂ + 2 KX",
      "Step 2: Hydrolysis R–CH(CN)₂ + H₃O⁺ → R–CH(COOH)₂",
      "Step 3: Heating leads to decarboxylation R–CH(COOH)₂ → R–CH₂–COOH"
    ]
  },
  {
    "id": "CPD10",
    "text": "What happens when vicinal dihalides react with KCN followed by acidic hydrolysis?",
    "options": [
      "Dicarboxylic acid or anhydride formation",
      "Monocarboxylic acid",
      "Alcohol",
      "Alkene"
    ],
    "correct": "A",
    "solution": "Vicinal dihalides form dicyano compounds, which hydrolyze to dicarboxylic acids, and on heating may give anhydrides.",
    "solution_steps": [
      "Step 1: R–CHX–CHX–R' + 2 KCN → R–CH(CN)–CH(CN)–R' + 2 KX",
      "Step 2: Hydrolysis R–CH(CN)–CH(CN)–R' + H₂O/H⁺ → R–CH(COOH)–CH(COOH)–R'",
      "Step 3: Heating may remove H₂O to form cyclic anhydride"
    ]
  },
  
  {
    "id": "DHP1",
    "text": "What is formed when a gem-dihalide R–CHX₂ is treated with aqueous KOH?",
    "options": [
      "Vicinal diol",
      "Gem-diol → Carbonyl compound",
      "Alkene",
      "Alcohol"
    ],
    "correct": "B",
    "solution": "Gem-dihalides hydrolyze to form unstable gem-diols, which dehydrate to aldehydes or ketones.",
    "solution_steps": [
      "OH⁻ ions replace both halogens forming R–CH(OH)₂.",
      "Gem-diol is unstable and loses H₂O.",
      "Resulting in R–CHO (aldehyde) or R₂C=O (ketone)."
    ]
  },
  {
    "id": "DHP2",
    "text": "Vicinal dihalides R–CHX–CHX–R' on hydrolysis with aqueous KOH form:",
    "options": [
      "Alkene",
      "Gem-diol",
      "Vicinal diol (glycol)",
      "Alcohol"
    ],
    "correct": "C",
    "solution": "Each halogen atom is replaced by –OH, forming vicinal diols.",
    "solution_steps": [
      "OH⁻ ions attack carbon atoms bonded to halogen.",
      "Each X atom is replaced by –OH.",
      "Product is R–CH(OH)–CH(OH)–R'."
    ]
  },
  {
    "id": "DHP3",
    "text": "Which base is required to convert vicinal dihalides to alkenes?",
    "options": [
      "Aqueous KOH",
      "Alcoholic KOH",
      "NaNH₂",
      "NaOH (solid)"
    ],
    "correct": "B",
    "solution": "Alcoholic KOH causes dehydrohalogenation to form alkenes.",
    "solution_steps": [
      "Alcoholic KOH abstracts β-hydrogen.",
      "Halide leaves forming a double bond.",
      "Product is a vicinal alkene."
    ]
  },
  {
    "id": "DHP4",
    "text": "Gem-dihalide R–CHX₂ reacts with alcoholic KOH to give:",
    "options": [
      "Alkyne",
      "Alkene",
      "Alcohol",
      "Ketone"
    ],
    "correct": "B",
    "solution": "Alcoholic KOH removes one halogen and β-H, forming a vinylic halide (alkene).",
    "solution_steps": [
      "One X and one H are eliminated.",
      "Vinylic halide R–C(X)=CH₂ is formed.",
      "Further reaction with NaNH₂ gives terminal alkyne."
    ]
  },
  {
    "id": "DHP5",
    "text": "Which reagent can remove the second halogen from vinylic halide to form a terminal alkyne?",
    "options": [
      "Alcoholic KOH",
      "NaNH₂",
      "Aqueous KOH",
      "Zn dust"
    ],
    "correct": "B",
    "solution": "NaNH₂ is a very strong base capable of abstracting vinylic H.",
    "solution_steps": [
      "NaNH₂ removes second HX from vinylic halide.",
      "Triple bond (alkyne) is formed.",
      "Terminal alkyne R–C≡CH is obtained."
    ]
  },
  {
    "id": "DHP6",
    "text": "Vicinal dihalide 2CH₃–CHCl–CH₂Cl reacts with Zn dust to give:",
    "options": [
      "Cycloalkane",
      "Alkene with same carbon atoms",
      "Alkyne",
      "Gem-diol"
    ],
    "correct": "B",
    "solution": "Zinc removes halogens causing 1,2-elimination to form alkene.",
    "solution_steps": [
      "Zn reduces C–X bonds.",
      "Elimination occurs forming C=C.",
      "Alkene product retains same carbon count."
    ]
  },
  {
    "id": "DHP7",
    "text": "Reaction of 2CH₃–CH₂–CHCl₂ with Zn dust can involve which intermediate?",
    "options": [
      "Carbocation",
      "Carbene",
      "Radical",
      "None"
    ],
    "correct": "B",
    "solution": "Geminal dihalides can form a carbene intermediate which can dimerize.",
    "solution_steps": [
      "Zn removes two halogens from same carbon.",
      "Highly reactive carbene intermediate forms.",
      "Two carbenes couple to form symmetrical alkene."
    ]
  },
  {
    "id": "DHP8",
    "text": "α–ω dihalide X–(CH₂)ₙ–X reacts with Zn or 2Na to give:",
    "options": [
      "Linear alkene",
      "Cycloalkane",
      "Alcohol",
      "Alkyne"
    ],
    "correct": "B",
    "solution": "Zinc or sodium removes terminal halogens, allowing intramolecular cyclization.",
    "solution_steps": [
      "Halogens removed as ZnX₂ or NaX.",
      "Two terminal carbons bond forming ring.",
      "Cycloalkane formed depending on chain length."
    ]
  },
  {
    "id": "DHP9",
    "text": "α–ω dihalide X–(CH₂)₄–X will form which cycloalkane upon reaction with Zn?",
    "options": [
      "Cyclobutane",
      "Cyclopentane",
      "Cyclohexane",
      "Cycloheptane"
    ],
    "correct": "B",
    "solution": "Four CH₂ units plus two terminal carbons form cyclopentane.",
    "solution_steps": [
      "Chain length n=4",
      "Ring size = n+1 = 5 carbons",
      "Cyclopentane obtained."
    ]
  },
  {
    "id": "DHP10",
    "text": "Gem-dihalide R–CHX₂ reacts with KCN to give after hydrolysis:",
    "options": [
      "R–CH(COOH)₂",
      "R–CH₂–COOH",
      "R–COOH",
      "R–CH₂–CN"
    ],
    "correct": "B",
    "solution": "Two –CN groups on same carbon hydrolyze to one carboxylic acid after decarboxylation.",
    "solution_steps": [
      "R–CH(CN)₂ formed first.",
      "Hydrolysis with H₃O⁺ gives R–CH(COOH)₂.",
      "On heating, one CO₂ lost → R–CH₂–COOH."
    ]
  }

]

;




let student = '';
let timerHandle;
let printMode = '';
let examDateTime = '';

const quizTitle = document.title.split("Quiz")[1]?.trim() || document.title;

function startQuiz() {
  const name = document.getElementById('studentNameInput').value.trim();
  if (!name) { alert('Please enter your name.'); return; }
  student = name;
  examDateTime = new Date().toLocaleString();
  document.getElementById('name-container').style.display = 'none';
  document.getElementById('quiz-container').style.display = 'block';
  buildQuestions();
  if (window.MathJax) MathJax.typesetPromise();
  startTimer();
}

function buildQuestions() {
  const out = document.getElementById('questions-container');
  out.innerHTML = '';

  Q.forEach((q, index) => {
    const qText = q.text || q.question || q.prompt || ''; // tolerate different keys

    // Normalize options into an ordered array of [letter, optionText]
    let entries = [];
    if (Array.isArray(q.options)) {
      entries = q.options.map((opt, i) => [String.fromCharCode(65 + i), opt]);
    } else if (q.options && typeof q.options === 'object') {
      const keys = Object.keys(q.options);
      const keysAreLetters = keys.every(k => /^[A-Z]$/.test(k));
      if (keysAreLetters) {
        keys.sort();
        entries = keys.map(k => [k, q.options[k]]);
      } else {
        entries = keys.map((k, i) => [String.fromCharCode(65 + i), q.options[k]]);
      }
    }

    const optionsHTML = entries.map(([letter, opt]) => {
      return `<label class="option-item" for="${q.id}-${letter}">
                <input type="radio" id="${q.id}-${letter}" name="${q.id}" value="${letter}" onchange="enableSubmit('${q.id}')">
                ${letter}. ${opt}
              </label>`;
    }).join('');

    const imageHTML = q.image ? `<div><img src="${q.image}" alt="figure" style="max-width:360px; margin:10px 0; display:block;"></div>` : '';

    // Handle solution steps if they exist
let solutionStepsHTML = '';
if (q.solution_steps && Array.isArray(q.solution_steps) && q.solution_steps.length > 0) {
  solutionStepsHTML = '<ul style="margin-top:10px;">' +
    q.solution_steps.map(step => {
      if (step.includes("\n")) {
        return `<li><pre style="background:#111; padding:6px; border-radius:4px; overflow-x:auto;">${step}</pre></li>`;
      }
      return `<li>${step}</li>`;
    }).join('') +
    '</ul>';
}


    out.insertAdjacentHTML('beforeend', `
      <div class="question" id="${q.id}-wrap">
        <h3>Q${index + 1}. ${qText}</h3>
        ${imageHTML}
        <div class="options">${optionsHTML}</div>
        <div id="${q.id}-buttons">
          <button id="sub-${q.id}" class="submit-button" disabled onclick="grade('${q.id}')">Submit</button>
          <button class="dontknow-button" onclick="skip('${q.id}')">I Don’t Know</button>
        </div>
        <button class="toggle-button" id="btn-sol-${q.id}" style="display:none;" onclick="toggleSolution('sol-${q.id}')">Show Solution</button>
        <div class="solution" id="sol-${q.id}">
          <strong>Solution:</strong> ${q.solution || ''} ${solutionStepsHTML}
        </div>
      </div>
    `);
  });

  if (window.MathJax && typeof MathJax.typesetPromise === 'function') MathJax.typesetPromise();
}



function enableSubmit(qid) { document.getElementById(`sub-${qid}`).disabled = false; }

function grade(qid) {
  const q = Q.find(x => x.id === qid);
  // accept different possible field names for the correct answer
  const correct = q.correct || q.answer || q.key || q.correctAnswer;
  const chosen = document.querySelector(`input[name="${qid}"]:checked`);
  if (!chosen) return;

  // lock options
  document.querySelectorAll(`input[name="${qid}"]`).forEach(i => i.disabled = true);

  // the chosen label
  const chosenLabel = chosen.closest('label.option-item');

  // find input that matches the correct letter
  const correctInput = document.querySelector(`input[name="${qid}"][value="${correct}"]`);
  const correctLabel = correctInput ? correctInput.closest('label.option-item') : null;

  if (chosen.value === correct) {
    // correct
    if (chosenLabel) {
      chosenLabel.style.background = '#28a745';
      chosenLabel.style.color = '#fff';
    }
  } else {
    // wrong: mark chosen red, mark correct green (if found)
    if (chosenLabel) {
      chosenLabel.style.background = '#dc3545';
      chosenLabel.style.color = '#fff';
    }
    if (correctLabel) {
      correctLabel.style.background = '#28a745';
      correctLabel.style.color = '#fff';
    }
  }

  // show solution immediately
  const solElem = document.getElementById(`sol-${qid}`);
  if (solElem) solElem.style.display = "block";

  // hide the buttons for this question
  const buttons = document.getElementById(`${qid}-buttons`);
  if (buttons) buttons.style.display = "none";
  const btnSol = document.getElementById(`btn-sol-${q.id}`);
  if (btnSol) btnSol.style.display = "none";

  // re-typeset MathJax for solution if it contains LaTeX
  if (window.MathJax && typeof MathJax.typesetPromise === 'function') MathJax.typesetPromise();
}


function skip(qid) { document.querySelectorAll(`input[name="${qid}"]`).forEach(r => r.disabled = true); showSolutionButton(qid); }
function showSolutionButton(qid) { document.getElementById(`btn-sol-${qid}`).style.display = 'inline-block'; document.getElementById(`${qid}-buttons`).style.display = 'none'; }
function toggleSolution(id) { const elem = document.getElementById(id); elem.style.display = elem.style.display === 'block' ? 'none' : 'block'; }

function startTimer() {
  const display = document.getElementById('timer');
  const started = Date.now();
  timerHandle = setInterval(() => { const s = Math.floor((Date.now() - started) / 1000); display.textContent = `${String((s / 60) | 0).padStart(2,'0')}:${String(s % 60).padStart(2,'0')}`; }, 1000);
}

function finalSubmit() {
  clearInterval(timerHandle);
  document.querySelectorAll("input[type=radio]").forEach(r => r.disabled = true);
  document.querySelectorAll(".submit-button, .dontknow-button").forEach(btn => btn.style.display = "none");

  let totalMarks = 0;
  let negativeMarks = 0;
  let possibleMarks = Q.length * 4;
  let detailHTML = '';

  Q.forEach((q, index) => {
    const checked = document.querySelector(`input[name="${q.id}"]:checked`);
    const chosen = checked ? checked.value : null;

    const correctLetter = q.correct || q.answer || q.key || q.correctAnswer;

    let marks = 0;
    let resultText = "";

    if (chosen === null) {
      marks = 0;
      resultText = "⚪ Not Attempted / I Don’t Know (0)";
    } else if (chosen === correctLetter) {
      marks = 4;
      resultText = "✅ Correct (+4)";
    } else {
      marks = -1;
      resultText = "❌ Incorrect (-1)";
    }

    totalMarks += marks > 0 ? marks : 0;
    negativeMarks += marks < 0 ? marks : 0;

    let solutionStepsHTML = '';
    if (q.solution_steps && Array.isArray(q.solution_steps) && q.solution_steps.length > 0) {
      solutionStepsHTML = '<ul style="margin-top:5px;">' +
        q.solution_steps.map(step => `<li>${step}</li>`).join('') +
        '</ul>';
    }

    detailHTML += `
      <tr>
        <td>${index + 1}</td>
        <td>${q.text || q.question}</td>
        <td>${chosen || 'Not Answered'}</td>
        <td>${correctLetter}</td>
        <td>${resultText}</td>
        <td>${q.solution || ''}${solutionStepsHTML}</td>
        <td>${marks}</td>
      </tr>`;
  });

  const finalScore = totalMarks + negativeMarks;

  document.getElementById('scoreText').innerHTML = `${student}, here is your result:`;
  document.getElementById('scoreDetails').innerHTML = detailHTML;

  const summaryHTML = `
    <div style="margin-top:20px; font-weight:bold;">
      <p>Total Marks (Possible): ${possibleMarks}</p>
      <p>Total Marks (Correct Answers): ${totalMarks}</p>
      <p>Negative Marks (Wrong Answers): ${negativeMarks}</p>
      <p>Final Score: ${finalScore}</p>
    </div>
  `;
  document.getElementById('scorecard').insertAdjacentHTML('beforeend', summaryHTML);

  document.getElementById('scorecard').style.display = 'block';
  document.getElementById('printScoreBtn').style.display = 'inline-block';
  document.getElementById('shareWhatsappBtn').style.display = 'inline-block';

  if (window.MathJax && typeof MathJax.typesetPromise === 'function') MathJax.typesetPromise();
}






function printQuestions() { printMode = "questions"; window.print(); }
function printScorecard() { document.getElementById("studentPrintName").innerText = student; document.getElementById("examDateTime").innerText = "Exam Date & Time: " + examDateTime; printMode = "scorecard"; window.print(); }

window.addEventListener('beforeprint', () => {
  if (printMode === "questions") { document.querySelector("#questions-container").style.display = "block"; document.querySelector("#scorecard").style.display = "none"; document.querySelector("#logo").style.display = "none"; document.querySelector("#name-container").style.display = "none"; document.querySelector("#timer").style.display = "none"; document.querySelector("#studentPrintName").style.display = "none"; document.querySelector("#examDateTime").style.display = "none"; }
  if (printMode === "scorecard") { document.querySelector("#questions-container").style.display = "none"; document.querySelector("#scorecard").style.display = "block"; document.querySelector("#logo").style.display = "block"; document.querySelector("#name-container").style.display = "none"; document.querySelector("#studentPrintName").style.display = "block"; document.querySelector("#examDateTime").style.display = "block"; }
});
window.addEventListener('afterprint', () => { document.querySelector("#questions-container").style.display = ""; document.querySelector("#scorecard").style.display = ""; document.querySelector("#logo").style.display = ""; document.querySelector("#name-container").style.display = ""; document.querySelector("#timer").style.display = ""; document.querySelector("#studentPrintName").style.display = "none"; document.querySelector("#examDateTime").style.display = "none"; });




document.getElementById("shareWhatsappBtn").addEventListener("click", function () {
  const whatsappNumber = "9108069409455";

  if (!student) {
    alert("Please complete the quiz first.");
    return;
  }

  const scoreText = document.getElementById('scoreText').innerText || "Result not available";

  let totalMarks = 0;
  let negativeMarks = 0;
  let possibleMarks = Q.length * 4;

  let details = "";

  Q.forEach((q, i) => {
    const qNum = i + 1;
    const checked = document.querySelector(`input[name="${q.id}"]:checked`);
    let userAns = checked ? checked.value : null;
    const correctAns = q.correct || q.answer || q.key || q.correctAnswer;

    let marks = 0;
    let resultText = "";

    if (userAns === null) {
      marks = 0;
      resultText = "⚪ Not Attempted / I Don’t Know (0)";
      userAns = "Not Answered";
    } else if (userAns === correctAns) {
      marks = 4;
      resultText = "✅ Correct (+4)";
    } else {
      marks = -1;
      resultText = "❌ Incorrect (-1)";
    }

    totalMarks += marks > 0 ? marks : 0;
    negativeMarks += marks < 0 ? marks : 0;

    details += `Q${qNum} → ${resultText} (Your Ans: ${userAns} | Correct: ${correctAns})\n`;
  });

  const finalScore = totalMarks + negativeMarks;

  const message = `Sir, I have shared my Test Result for checking. Thank you!\n\n📘 Quiz Title: ${quizTitle}\n👤 Student: ${student}\n\n${scoreText}\n\n📊 Summary:\n✔ Total Marks (Possible): ${possibleMarks}\n✔ Total Marks (Correct Answers): ${totalMarks}\n✔ Negative Marks (Wrong Answers): ${negativeMarks}\n✔ Final Score: ${finalScore}\n\nDetails:\n${details}`;

  const waUrl = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;
  window.open(waUrl, "_blank");
});


const reportBtn = document.getElementById("reportBtn");
const reportModal = document.getElementById("reportModal");
const sendReport = document.getElementById("sendReport");
const closeReport = document.getElementById("closeReport");
const reportMsg = document.getElementById("reportMsg");

reportBtn.onclick = () => { reportModal.style.display = "block"; };
closeReport.onclick = () => { reportModal.style.display = "none"; reportMsg.value = ""; };
sendReport.onclick = () => {
  const msg = reportMsg.value.trim();
  if (!msg) { alert("Please write your message before sending."); return; }
  const whatsappNumber = "9108069409455";
  const message = `⚠️ Reported Mistake\n\n📘 Quiz Title: ${quizTitle}\n👤 Student: ${student || "Anonymous"}\n\n📝 Message:\n${msg}`;
  const waUrl = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;
  window.open(waUrl, "_blank");
  reportModal.style.display = "none";
  reportMsg.value = "";
};
</script>
